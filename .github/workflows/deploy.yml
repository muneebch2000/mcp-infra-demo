name: Deploy MCP Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy-terraform:
    name: Deploy GCP Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/300640378042/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions@project-e7638f0a-2e9b-4a24-b72.iam.gserviceaccount.com"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan \
          -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve \
          -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: deploy-terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy index.js --name mcp-server --compatibility-date 2024-01-01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}